name: QuizMaster CI/CD

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:
    branches:
      - main

jobs:
  quality:
    name: Lint and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test

  docker:
    name: Build Docker Image
    needs: quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t quizmaster:ci .

  deploy:
    name: Deploy to Render
    needs: docker
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render deployment
        run: |
          curl --fail-with-body -X POST \
            "${{ secrets.RENDER_DEPLOY_HOOK }}&ref=${{ github.sha }}"

  verify:
    name: Verify Live Application
    needs: deploy
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Wait for Render deployment
        run: sleep 30

      - name: Check health endpoint
        run: |
          for i in {1..10}; do
            if curl --fail --silent \
              https://quiz-app-y7fu.onrender.com/health \
              | grep -q '"status":"ok"'; then
              echo "Health check passed."
              exit 0
            fi

            echo "Application not ready yet. Waiting..."
            sleep 15
          done

          echo "Health check failed."
          exit 1

      - name: Check live quiz page
        run: |
          curl --fail --silent \
            https://quiz-app-y7fu.onrender.com/quiz \
            > /tmp/quiz.html

          grep -q "Quiz" /tmp/quiz.html

          echo "Quiz page check passed."